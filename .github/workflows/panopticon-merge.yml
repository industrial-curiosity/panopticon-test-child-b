# Wired by Panopticon install.py — a thin reference to the shared workflow in the instance repo.
# Re-run install.py or panopticon.sync to update. Secrets and variables are org-level; this repo configures none.
name: Panopticon merge sync
on:
  push:
    branches: [main]
jobs:
  panopticon:
    uses: industrial-curiosity/panopticon-demo/.github/workflows/panopticon-merge.yml@main
    secrets:
      instance_token: ${{ secrets.PANOPTICON_INSTANCE_TOKEN_DEMO }}
