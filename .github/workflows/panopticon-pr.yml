# Wired by Panopticon install.py — a thin reference to the shared workflow in the instance repo.
# Re-run install.py or panopticon.sync to update. Secrets and variables are org-level; this repo configures none.
name: Panopticon PR checks
on:
  pull_request:
jobs:
  panopticon:
    uses: industrial-curiosity/panopticon-test/.github/workflows/panopticon-pr-litellm.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      instance: industrial-curiosity/panopticon-test
      workflow_ref: main
      configuration_revision: 64767e9bffbf111190f5712f525136d020754090611cc7e4abb61c2aa1d56865
      configuration_names: '{"api_key":"PANOPTICON_LLM_API_KEY","endpoint":"PANOPTICON_LLM_ENDPOINT","instance_token":"PANOPTICON_INSTANCE_TOKEN","job_timeout_minutes":"PANOPTICON_LLM_JOB_TIMEOUT_MINUTES","max_attempts":"PANOPTICON_LLM_MAX_ATTEMPTS","max_correction_attempts":"PANOPTICON_LLM_MAX_CORRECTION_ATTEMPTS","model":"PANOPTICON_LLM_MODEL","timeout_seconds":"PANOPTICON_LLM_TIMEOUT_SECONDS"}'
      model: ${{ vars.PANOPTICON_LLM_MODEL }}
      timeout_seconds: ${{ vars.PANOPTICON_LLM_TIMEOUT_SECONDS }}
      max_attempts: ${{ vars.PANOPTICON_LLM_MAX_ATTEMPTS }}
      max_correction_attempts: ${{ vars.PANOPTICON_LLM_MAX_CORRECTION_ATTEMPTS }}
      job_timeout_minutes: ${{ vars.PANOPTICON_LLM_JOB_TIMEOUT_MINUTES }}
      endpoint: ${{ vars.PANOPTICON_LLM_ENDPOINT }}
    secrets:
      instance_token: ${{ secrets.PANOPTICON_INSTANCE_TOKEN }}
      api_key: ${{ secrets.PANOPTICON_LLM_API_KEY }}
